[project]
name = "nrep"
version = "0.1.0"
description = "Saudi NREP solar tariff tracker and LCOE reverse-engineering"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "openpyxl",
    "python-pptx",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nrep"]

[tool.ruff]
line-length = 100
